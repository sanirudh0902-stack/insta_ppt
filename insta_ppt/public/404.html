<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Instagram Mastery</title>
  <meta name="theme-color" content="#E1306C">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #FAFAFA;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      max-width: 400px;
      background: #fff;
      border-radius: 28px;
      padding: 40px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }
    .code { font-size: 72px; font-weight: 900; background: linear-gradient(135deg, #E1306C, #833AB4, #F77737); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    h1 { font-size: 20px; margin: 8px 0; }
    p { color: #666; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #E1306C, #833AB4);
      color: #fff;
      border-radius: 14px;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <a href="/index.html">Go Home</a>
  </div>
</body>
</html>
