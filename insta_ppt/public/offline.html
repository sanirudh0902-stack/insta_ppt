<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offline — Instagram Mastery</title>
  <meta name="theme-color" content="#E1306C">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #FAFAFA;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .card {
      max-width: 400px;
      background: #fff;
      border-radius: 28px;
      padding: 40px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }
    h1 { font-size: 24px; margin: 16px 0 8px; }
    p { color: #666; line-height: 1.5; }
    .retry-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 28px;
      background: linear-gradient(135deg, #E1306C, #833AB4);
      color: #fff;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:48px;margin-bottom:8px">&#x1F4F6;</div>
    <h1>You're Offline</h1>
    <p>Connect to the internet and try again to continue your Instagram journey.</p>
    <button class="retry-btn" onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
